<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIRR Fare Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 16px; background: #fff; color: #111; }
    .msg { margin: .75rem 0; white-space: pre-wrap; }
    .you { font-weight: 600; }
    details { font-size: .8rem; color: #555; margin: .25rem 0; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: .5rem; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>LIRR Fare Change Agent</h1>
  <p>Temporary test page (milestone 3). The real front end comes in milestone 6.</p>
  <div id="log"></div>
  <form id="f">
    <input id="q" placeholder="e.g. How did ten-trip and day pass sales change after January 2026?" autocomplete="off">
    <button>Ask</button>
  </form>
<script>
let sessionId = null;
const log = document.getElementById("log");
function add(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
}
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("q");
  const message = input.value.trim();
  if (!message) return;
  input.value = "";
  add("you", message);
  add("bot", "Working...");
  const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message, session_id: sessionId }) });
  log.lastChild.remove();
  const data = await res.json();
  if (!res.ok) { add("bot", "Error: " + (data.detail || res.status)); return; }
  sessionId = data.session_id;
  for (const t of data.tool_calls) {
    const d = document.createElement("details");
    d.innerHTML = `<summary>🔧 [${t.agent}] ${t.name}</summary><pre></pre>`;
    d.querySelector("pre").textContent = JSON.stringify({ args: t.args, result: t.result }, null, 2);
    log.appendChild(d);
  }
  add("bot", data.response);
});
</script>
</body>
</html>
